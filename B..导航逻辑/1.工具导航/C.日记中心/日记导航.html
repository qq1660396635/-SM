<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记中心</title>
    <!-- 引用外部配置文件 -->
    <script src="日记-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 40%, #f4a460 80%, #ff8c00 100%);
            min-height: 100vh; padding: 10px; position: relative; overflow-x: hidden;
        }
        /* 背景 */
        .city-skyline { position: fixed; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .sky-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 70%; background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 20%, #7e8ba3 50%, #f4a460 80%, #ff8c00 100%); }
        .buildings { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: #1a1a2e; clip-path: polygon(0% 100%, 0% 45%, 5% 45%, 5% 35%, 10% 35%, 10% 45%, 15% 45%, 15% 25%, 20% 25%, 20% 45%, 25% 45%, 25% 35%, 30% 35%, 30% 45%, 35% 45%, 35% 20%, 40% 20%, 40% 45%, 45% 45%, 45% 30%, 50% 30%, 50% 45%, 55% 45%, 55% 38%, 60% 38%, 60% 45%, 65% 45%, 65% 28%, 70% 28%, 70% 45%, 75% 45%, 75% 33%, 80% 33%, 80% 45%, 85% 45%, 85% 42%, 90% 42%, 90% 45%, 95% 45%, 95% 25%, 100% 25%, 100% 100%); }
        
        .window { position: absolute; background: #ffeb3b; animation: flicker 4s infinite; }
        @keyframes flicker { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
        
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .cloud { position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 100px; opacity: 0.8; animation: float 20s infinite linear; }
        @keyframes float { from { transform: translateX(-200px); } to { transform: translateX(calc(100vw + 200px)); } }

        /* 布局容器 */
        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        header { text-align: center; margin-bottom: 20px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        h1 { font-size: 2rem; letter-spacing: 2px; }
        
        /* 强制3列布局 */
        .tools-grid {
            display: grid;
            /* 核心要求：强制一行三个 */
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
        }

        .tool-card {
            background: rgba(255,255,255,0.9); border-radius: 10px; padding: 15px 5px;
            text-decoration: none; color: #333; display: flex; flex-direction: column;
            align-items: center; text-align: center; transition: transform 0.2s;
        }
        .tool-card:hover { transform: translateY(-3px); background: rgba(255,255,255,1); }
        
        .tool-number { background: #ff6b6b; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-bottom: 5px; }
        .tool-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
        .tool-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
        .tool-description { font-size: 0.7rem; color: #666; line-height: 1.2; height: 2.4em; overflow: hidden; }

        /* 分页 */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .pagination button {
            border: none; background: rgba(255,255,255,0.9); color: #333;
            padding: 5px 10px; border-radius: 4px; cursor: pointer; min-width: 30px;
        }
        .pagination button.active { background: #4ecdc4; color: white; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 针对极小屏幕保持3列但缩小字体 */
        @media (max-width: 600px) {
            .tools-grid { gap: 5px; }
            .tool-card { padding: 8px 2px; }
            .tool-icon { font-size: 1.5rem; margin-bottom: 3px; }
            .tool-name { font-size: 0.75rem; }
            .tool-description { font-size: 0.6rem; height: 2em; }
            .tool-number { font-size: 9px; padding: 1px 5px; }
        }
    </style>
</head>
<body>
    <!-- 背景层 -->
    <div class="city-skyline">
        <div class="sky-gradient"></div>
        <div class="buildings"></div>
        <div class="windows" id="windows"></div>
        <div class="stars" id="stars"></div>
        <div class="clouds" id="clouds"></div>
    </div>

    <div class="container">
        <header>
            <h1>🏙️ 日记中心</h1>
            <p>记录都市生活的点点滴滴</p>
        </header>
        <main>
            <div class="tools-grid" id="toolsGrid"></div>
            <div class="pagination" id="pagination"></div>
        </main>
    </div>

    <script>
        let currentPage = 1;
        const toolsPerPage = 9; // 3x3布局，每页9个
        let allTools = [];

        // 简单的背景生成
        function initBg() {
            const winCount = 40, starCount = 20, cloudCount = 3;
            for(let i=0; i<winCount; i++) {
                let w = document.createElement('div'); w.className = 'window';
                w.style.width = Math.random()*4+2+'px'; w.style.height = Math.random()*4+2+'px';
                w.style.left = Math.random()*100+'%'; w.style.bottom = Math.random()*60+'%';
                w.style.animationDelay = Math.random()*4+'s'; document.getElementById('windows').appendChild(w);
            }
            for(let i=0; i<starCount; i++) {
                let s = document.createElement('div'); s.className = 'star';
                s.style.width = Math.random()*2+1+'px'; s.style.height = s.style.width;
                s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
                document.getElementById('stars').appendChild(s);
            }
            for(let i=0; i<cloudCount; i++) {
                let c = document.createElement('div'); c.className = 'cloud';
                c.style.width = Math.random()*60+80+'px'; c.style.height = Math.random()*20+30+'px';
                c.style.top = Math.random()*50+'%'; c.style.animationDelay = i*7+'s';
                document.getElementById('clouds').appendChild(c);
            }
        }

        // 初始化工具数据（从配置文件读取）
        function initTools() {
            if(window.toolsConfig && window.toolsConfig.getAllTools) {
                allTools = window.toolsConfig.getAllTools();
            }
            render();
        }

        // 渲染页面
        function render() {
            const grid = document.getElementById('toolsGrid');
            const pageCtrl = document.getElementById('pagination');
            grid.innerHTML = ''; pageCtrl.innerHTML = '';

            if(!allTools.length) return;

            const total = allTools.length;
            const maxPage = Math.ceil(total / toolsPerPage);
            if(currentPage > maxPage) currentPage = maxPage;
            if(currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * toolsPerPage;
            const end = start + toolsPerPage;
            const toolsToShow = allTools.slice(start, end);

            toolsToShow.forEach((tool, index) => {
                const globalIndex = start + index + 1;
                const card = document.createElement('a');
                card.className = 'tool-card';
                card.href = tool.file;
                card.innerHTML = `
                    <span class="tool-number">#${globalIndex}</span>
                    <span class="tool-icon">${tool.icon}</span>
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-description">${tool.description}</div>
                `;
                grid.appendChild(card);
            });

            // 简单分页
            if(maxPage > 1) {
                const prev = document.createElement('button'); prev.innerText = '‹'; prev.disabled = currentPage===1;
                prev.onclick = () => { currentPage--; render(); }; pageCtrl.appendChild(prev);

                for(let i=1; i<=maxPage; i++) {
                    const btn = document.createElement('button'); btn.innerText = i;
                    if(i===currentPage) btn.className = 'active';
                    btn.onclick = () => { currentPage = i; render(); }; pageCtrl.appendChild(btn);
                }

                const next = document.createElement('button'); next.innerText = '›'; next.disabled = currentPage===maxPage;
                next.onclick = () => { currentPage++; render(); }; pageCtrl.appendChild(next);
            }
        }

        window.onload = function() {
            initBg();
            initTools();
        };
    </script>
</body>
</html>
